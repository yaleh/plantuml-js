name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write   # OIDC token for npm trusted publishing (no long-lived npm token)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Guard: tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "tag v$TAG_VERSION does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Test
        run: npm test

      # Trusted publishing (npm provenance) needs a recent npm; Node 22 ships an
      # older one. Upgrade after `npm ci` so the existing lockfile still installs.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest && npm --version

      # Authentication is OIDC (the `id-token: write` above): npm exchanges the
      # GitHub OIDC token, so no NPM_TOKEN secret is involved. `--provenance`
      # also records the supply-chain attestation. Requires one-time npm-side
      # config: the `@yalehwang/plantuml-js` package must trust this repo
      # (npmjs.com → package → Settings → Access → add GitHub `yaleh/plantuml-js`).
      - name: Publish
        run: npm publish --access public --provenance
